name: Sincroniza Teste com Notion

on:
  push:
    branches:
      - main

jobs:
  sync_notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Inserir Commit no Notion via API
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DATABASE_ID }}
        with:
          script: |
            // Captura os dados do commit disparado
            const commitMessage = context.payload.head_commit.message;
            const authorName = context.actor;
            const commitHash = context.sha;
            const repoName = context.payload.repository.name;
            const commitUrl = context.payload.head_commit.url;

            // Faz a requisição direta (HTTP POST) para a API do Notion
            const response = await fetch('https://api.notion.com/v1/pages', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NOTION_TOKEN}`,
                'Content-Type': 'application/json',
                'Notion-Version': '2022-06-28'
              },
              body: JSON.stringify({
                parent: { database_id: process.env.NOTION_DB },
                properties: {
                  "Nome": { title: [{ text: { content: commitMessage } }] },
                  "Autor": { rich_text: [{ text: { content: authorName } }] },
                  "Hash": { rich_text: [{ text: { content: commitHash } }] },
                  "Repo": { rich_text: [{ text: { content: repoName } }] },
                  "Link": { url: commitUrl }
                }
              })
            });

            // Imprime o resultado no Log para facilitar a depuração
            const data = await response.json();
            console.log(data);
